    <!-- Apply the saved theme / CRT preference before first paint (see SettingsProvider). -->
    <script>
      try {
        var d = document.documentElement
        var t = JSON.parse(localStorage.getItem('shahrul-os:theme'))
        var c = JSON.parse(localStorage.getItem('shahrul-os:crt'))
        if (t === 'matrix' || t === 'synthwave' || t === 'ice') d.dataset.theme = t
        if (typeof c === 'boolean') d.dataset.crt = String(c)
      } catch (e) {}
    </script>

    <!-- Only the body font is preloaded: it renders the LCP text. -->
